name: Claude Review

# Required on every pull request in the org by an org ruleset ("Require workflows to pass"), so no
# repository carries its own copy. The Anthropic WIF federation rule pins this file on
# refs/heads/main through the OIDC job_workflow_ref claim: moving or renaming it needs the rule
# updated first, and a PR branch cannot reuse the identity with a workflow of its own.

on:
  # A ruleset ignores `types:` and runs this only on opened, synchronize and reopened, so no
  # filter here; whether to review is decided at runtime by the gate job.
  pull_request:

permissions: {}

# Queue instead of cancel: a push during a review must not cancel the only review attempt. The
# queued run then sees the finished review and skips.
concurrency:
  group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  gate:
    name: Gate
    # Forks get no OIDC token, bots (Renovate) would spend most of the monthly credit, and drafts
    # are reviewed on the first push after they are marked ready (ready_for_review never reaches
    # a ruleset workflow).
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      review: ${{ steps.check.outputs.review }}
    steps:
      - name: Check for a completed review
        id: check
        # Same reason as the review step: a GitHub API hiccup here must not block merging. The
        # output stays empty, so the review is skipped and retried on the next push.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        # One review per PR keeps cost within the monthly credit. Only the marker that the review
        # prompt asks for counts, so a failed or cancelled attempt is retried on the next push.
        run: |
          done=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '[.[] | select(.user.type == "Bot" and (.body | contains("<!-- claude-review:done -->")))] | length' \
            | awk '{s += $1} END {print s + 0}')
          if [ "$done" -gt 0 ]; then echo "review=false" >> "$GITHUB_OUTPUT"; else echo "review=true" >> "$GITHUB_OUTPUT"; fi

  review:
    name: Review
    needs: gate
    if: needs.gate.outputs.review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write # OIDC token for the Anthropic federation exchange and the Claude GitHub App token
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Claude review
        # A required workflow blocks merging when it fails; an API outage or exhausted credit must
        # not block the org, so a failed review leaves the run green.
        continue-on-error: true
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          # Identifiers, not credentials: the federation rule decides who may use them.
          anthropic_organization_id: 033fc13c-dee4-4de6-9eae-82d7529bbeb4
          anthropic_federation_rule_id: fdrl_01KfnbUdSDHcC278wVsGvkGF
          anthropic_service_account_id: svac_014xjuiLAzbiEbcdvmhikCdW
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness: bugs, broken edge cases, security problems,
            and violations of the repository's CLAUDE.md / AGENTS.md rules. Read surrounding code
            as needed to confirm each finding. Report only findings you have verified; skip style
            nits and anything a linter or formatter would catch.

            Post each finding as an inline comment on the line it concerns. Finish with one short
            summary comment; if there are no findings, say so in one line. End the summary comment with
            the line <!-- claude-review:done --> exactly once; post it only after the review is complete.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
