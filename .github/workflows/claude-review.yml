name: Claude Review

# Required on every pull request in the org by an org ruleset ("Require workflows to pass"), so no
# repository carries its own copy. The Anthropic WIF federation rule pins this file on
# refs/heads/main through the OIDC job_workflow_ref claim: moving or renaming it needs the rule
# updated first, and a PR branch cannot reuse the identity with a workflow of its own.

on:
  # A ruleset ignores filters and runs this on opened, synchronize and reopened, so every push
  # gets a fresh review.
  pull_request:

permissions: {}

# A newer push supersedes the review of the previous head.
concurrency:
  group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    # Forks get no OIDC token, bots (Renovate) would spend most of the monthly credit, and drafts
    # are reviewed on their first push after being marked ready.
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    # The self-hosted runner group is closed to public repositories; a public PR would wait for a
    # runner forever and block its merge.
    runs-on: ${{ github.event.repository.private && 'gcp-small' || 'ubuntu-latest' }}
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write # OIDC token for the Anthropic federation exchange and the Claude GitHub App token
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Claude review
        # A required workflow blocks merging when it fails; an API outage or exhausted credit must
        # not block the org, so a failed review leaves the run green.
        continue-on-error: true
        uses: anthropics/claude-code-action@4411a9e9b0283becf4b924f7bce360fd7756c78c # v1.0.290
        with:
          # Identifiers, not credentials: the federation rule decides who may use them.
          anthropic_organization_id: 033fc13c-dee4-4de6-9eae-82d7529bbeb4
          anthropic_federation_rule_id: fdrl_01KfnbUdSDHcC278wVsGvkGF
          anthropic_service_account_id: svac_014xjuiLAzbiEbcdvmhikCdW
          use_sticky_comment: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request for correctness: bugs, broken edge cases, security problems,
            and violations of the repository's CLAUDE.md / AGENTS.md rules. Read surrounding code
            as needed to confirm each finding. Report only findings you have verified; skip style
            nits and anything a linter or formatter would catch.

            Post each finding as an inline comment on the line it concerns. Finish with one short
            summary comment; if there are no findings, say so in one line.
          claude_args: |
            --model claude-opus-5-5
            --max-turns 40
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
